name: Daily Job Scraper

on:
  schedule:
    - cron: '0 2 * * *'  # Runs every day at 7:30am IST (2:00 UTC)
  workflow_dispatch:       # Also allows manual trigger from GitHub

# never let two scraper runs overlap (two runs at once is how duplicates get inserted)
concurrency:
  group: daily-job-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scraper/scraper.py